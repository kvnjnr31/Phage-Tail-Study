# tiger_simulation_config.yaml
# Hybrid TIGER–LBM config with explicit physical + forcing knobs
# Calibrated to E. coli run-and-tumble parameters (Watari & Larson, Berg).

grid:
  nx: 96
  ny: 64
  nz: 64

fluid:
  tau: 0.9    # LBM relaxation time

simulation:
  steps: 2000
  dt: 0.02    # lattice time units per step

bacterium:
  # TIGER body parameters in lattice units
  center: [48, 32, 32]
  Rb: 10.0        # body radius in lattice units
  kE: 1.3
  k: 1.3
  w: -100.0       # tail angular frequency in TIGER param
  h: 0.77         # tail amplitude

physical:
  Rb_um: 1.0
  helix_radius_factor: 0.85
  helix_pitch_factor: 0.60
  nu_phys_target: 1.0e-6
  rho_phys: 1000.0
  bundle_target_Hz: 100.0
  f_bundle_lb_measured: 1.6978e-2

forcing:
  # Source model toggles
  use_stresslet: false
  use_rotlet_ring_body: true
  use_helical_bundle: true

  use_tail: false
  force_free_tail: false
  head_drag_offset: -0.25      # head counterforce center at x_c + offset*Rb
  auto_disable_stresslet_when_tail: true

  # Tail forcing
  tail_samples: 200
  ft_tail: 1.0              # per-sample thrust along +x

  # Stresslet dipole
  f_stress: 0.0               # force magnitude for ±F dipole
  d_stress: null               # null → 0.8*Rb

  # Torque magnitude (bundle / body ring)
  torque_gamma: 1e-3            # total |Γ| for bundle; body gets −Γ

  # Deposition smoothing
  sigma: 3.0                   # Gaussian width [lu]
  stencil_r: 4                 # half-width in lattice cells

  # Helical bundle geometry (Watari & Larson ratios)
  n_helices: 1
  n_turn_integer: 3
  pts_per_turn: 120
  xoff_helix_factor: 0.6       # axial offset (in units of Rb)

  # Bundle/body angular frequencies in lattice units (rad / tu)
  omega_bundle: 6.0
  omega_body: -6.0

  # Body torque ring
  ring_r_body_factor: 0.55     # ring radius in units of Rb
  xoff_body: 0.0               # axial offset of ring center [lu]
  n_torque_pts: 48

output:
  path: data/numerical
  velocity_field: velocity_field.npy
  velocity_field_small: velocity_field_small.npy
  bacterium_path: bacterium_path.npy
  tail_coords: tail_coords.npy
 
